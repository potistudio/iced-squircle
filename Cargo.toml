[package]
name = "iced-squircle"
description = "Squircle (superellipse-cornered) surfaces for iced."
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
authors = ["potistudio <potistudio@proton.me>"]
license = "MIT"
publish = false
repository = "https://github.com/potistudio/iced-squircle"
readme = "README.md"
keywords = ["iced", "gui", "squircle", "superellipse"]
categories = ["gui"]

# Stay the workspace root when cloned under a parent workspace that does not list this crate as a member.
[workspace]

[dependencies]
iced = { version = "0.14.0", features = ["canvas"] }

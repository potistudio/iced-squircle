[package]
name = "iced-squircle"
description = "Squircle (superellipse-cornered) surfaces for iced."
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["potistudio <potistudio@proton.me>"]
license = "MIT"
repository = "https://github.com/potistudio/iced-squircle"
readme = "README.md"
keywords = ["iced", "gui", "squircle", "superellipse"]
categories = ["gui"]
include = ["/src", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[dependencies]
# `iced_widget` re-exports the same types as `iced` without enabling any renderer, executor, or
# platform feature, so the application keeps full control over iced's features.
iced_widget = { version = "0.14.0", features = ["canvas"] }

[dev-dependencies]
iced = "0.14.0"
